[package]
name = "nodenetwork-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["process", "time", "net", "io-util", "sync", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
